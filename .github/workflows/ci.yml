name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow never needs to write to the repository.
# Do not add `pull_request_target` or repository secrets to this file —
# it runs code from untrusted pull requests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them fresh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  # Single stable check name for the branch ruleset's required status check.
  ci:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the test matrix to have passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = "success"
